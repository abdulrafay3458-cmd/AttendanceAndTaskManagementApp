workflows:
  ios-sideload-unsigned:
    name: iOS Sideload (Unsigned Build)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter version check
        script: flutter --version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Clean build
        script: flutter clean && flutter pub get

      - name: Pod install
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build iOS release (no codesign)
        script: |
          flutter build ios --release --no-codesign

      - name: Build Xcode Archive
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            -archivePath "$CM_BUILD_DIR/Runner.xcarchive" \
            archive | xcpretty

      - name: Package into IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/Runner.xcarchive/Products/Applications/Runner.app" \
            "$CM_BUILD_DIR/Payload/Runner.app"
          cd "$CM_BUILD_DIR"
          zip -r unsigned_app.ipa Payload

    artifacts:
      - $CM_BUILD_DIR/Runner.xcarchive
      - $CM_BUILD_DIR/unsigned_app.ipa

    publishing:
      email:
        recipients:
          - your-email@example.com   # ← change this
        notify:
          success: true
          failure: true
