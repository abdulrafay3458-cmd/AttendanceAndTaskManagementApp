workflows:
  ios-sideload-unsigned:
    name: iOS Unsigned Build (Sideloadly)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

    scripts:
      - name: Flutter setup
        script: |
          flutter --version
          flutter config --no-enable-swift-package-manager
          flutter clean
          flutter pub get

      - name: Generate iOS config only
        script: |
          flutter build ios --config-only --release --no-codesign

      - name: Pod install
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          pod install --repo-update

      - name: Create unsigned Xcode archive
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -archivePath "$CM_BUILD_DIR/Runner.xcarchive" \
            archive

      - name: Package IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r "$CM_BUILD_DIR/Runner.xcarchive/Products/Applications/Runner.app" "$CM_BUILD_DIR/Payload/"
          cd "$CM_BUILD_DIR"
          zip -r unsigned_app.ipa Payload

    artifacts:
      - $CM_BUILD_DIR/unsigned_app.ipa
      - $CM_BUILD_DIR/Runner.xcarchive
