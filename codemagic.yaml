workflows:
  ios-unsigned-build:
    name: iOS Unsigned Build
    max_build_duration: 120
    environment:
      flutter: stable
      xcode: 15.4
      cocoapods: default

    scripts:
      - name: Flutter version
        script: flutter --version

      - name: Get Flutter packages
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update

      - name: Clean Flutter build
        script: flutter clean

      - name: Get packages again after clean
        script: flutter pub get

      - name: Build iOS Release
        script: |
          flutter build ios --release --no-codesign

      - name: Create Archive Directory
        script: mkdir -p build/ios/archive

      - name: Build Xcode Archive
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            -archivePath build/ios/archive/Runner.xcarchive \
            archive

      - name: Create IPA Directory
        script: mkdir -p build/ios/ipa

      - name: Create Unsigned IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app \
            build/ios/ipa/Payload/Runner.app
          cd build/ios/ipa
          zip -r ../unsigned_app.ipa Payload

    artifacts:
      - build/ios/ipa/unsigned_app.ipa
      - build/ios/archive/Runner.xcarchive
      - flutter_drive.log
