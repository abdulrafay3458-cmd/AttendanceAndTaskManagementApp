workflows:
  ios-simulator-debug:
    name: iOS Simulator Build (for Appetize debugging)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (avoid CocoaPods conflict)
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build iOS simulator app
        script: |
          flutter build ios --simulator --debug

          cd build/ios/iphonesimulator
          zip -r ../../../Runner.app.zip Runner.app
          cd ../../../

    artifacts:
      - Runner.app.zip


  ios-sideload-unsigned:
    name: iOS Sideload (Unsigned Build)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (avoid CocoaPods conflict)
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
          cd ..

      - name: Build unsigned iOS app (no code signing)
        script: |
          flutter build ipa --release --no-codesign

          cd build/ios/archive
          mkdir -p Payload
          cp -r Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r ../../../unsigned_app.ipa Payload
          cd ../../../

    artifacts:
      - build/ios/archive/*.xcarchive
      - unsigned_app.ipa

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
