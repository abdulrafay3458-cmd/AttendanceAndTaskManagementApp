workflows:
  ios-sideload-unsigned:
    name: iOS Unsigned Build (Sideloadly)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: 16.2      # ← pin to 15.4, avoid latest SPM issues
      cocoapods: default

    scripts:
      - name: Flutter version
        script: flutter --version

      - name: Get packages
        script: flutter pub get

      - name: Flutter clean
        script: flutter clean && flutter pub get

      - name: Disable Swift Package Manager
        script: |
          cd ios
          defaults write com.apple.dt.Xcode IDEPackageSupportUseBuiltinSPMIntegration -bool NO
          cd ..

      - name: Pod install
        script: |
          cd ios
          rm -rf Pods
          rm -f Podfile.lock
          pod install --repo-update
          cd ..

      - name: Build iOS no codesign
        script: |
          flutter build ios \
            --release \
            --no-codesign \
            --no-tree-shake-icons

      - name: Create Xcode Archive
        script: |
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=13.0 \
            -archivePath "$CM_BUILD_DIR/Runner.xcarchive" \
            archive

      - name: Package IPA
        script: |
          mkdir -p "$CM_BUILD_DIR/Payload"
          cp -r \
            "$CM_BUILD_DIR/Runner.xcarchive/Products/Applications/Runner.app" \
            "$CM_BUILD_DIR/Payload/Runner.app"
          cd "$CM_BUILD_DIR"
          zip -r unsigned_app.ipa Payload

    artifacts:
      - $CM_BUILD_DIR/unsigned_app.ipa
      - $CM_BUILD_DIR/Runner.xcarchive
