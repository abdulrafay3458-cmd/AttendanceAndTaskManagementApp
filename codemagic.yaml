workflows:
  ios-simulator-debug:
    name: iOS Simulator Build (for Appetize debugging)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (avoid CocoaPods conflict)
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set iOS deployment target to 15.5
        script: |
          # Flutter generates ios/Podfile with the platform line commented out,
          # so set it explicitly (newer ML Kit needs iOS 15.5+).
          if [ ! -f ios/Podfile ]; then
            flutter build ios --config-only --no-codesign || true
          fi
          if [ -f ios/Podfile ]; then
            sed -i '' -E "s/^# *platform :ios, '.*'/platform :ios, '15.5'/" ios/Podfile
            grep -n "platform :ios" ios/Podfile || echo "platform line not found"
          fi
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Build iOS simulator app
        script: |
          flutter build ios --simulator --debug

          cd build/ios/iphonesimulator
          zip -r ../../../Runner.app.zip Runner.app
          cd ../../../

    artifacts:
      - Runner.app.zip


  ios-sideload-unsigned:
    name: iOS Sideload (Unsigned Build)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Disable Swift Package Manager (avoid CocoaPods conflict)
        script: |
          flutter config --no-enable-swift-package-manager

      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Set iOS deployment target to 15.5
        script: |
          # Flutter generates ios/Podfile with the platform line commented out,
          # so set it explicitly (newer ML Kit needs iOS 15.5+).
          if [ ! -f ios/Podfile ]; then
            flutter build ios --config-only --no-codesign || true
          fi
          if [ -f ios/Podfile ]; then
            sed -i '' -E "s/^# *platform :ios, '.*'/platform :ios, '15.5'/" ios/Podfile
            grep -n "platform :ios" ios/Podfile || echo "platform line not found"
          fi
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.5;/g" ios/Runner.xcodeproj/project.pbxproj

      - name: Build unsigned iOS app (no code signing)
        script: |
          flutter build ipa --release --no-codesign

          cd build/ios/archive
          mkdir -p Payload
          cp -r Runner.xcarchive/Products/Applications/Runner.app Payload/
          zip -r ../../../unsigned_app.ipa Payload
          cd ../../../

    artifacts:
      - build/ios/archive/*.xcarchive
      - unsigned_app.ipa

    publishing:
      email:
        recipients:
          - your-email@example.com
        notify:
          success: true
          failure: true
